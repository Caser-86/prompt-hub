name: Release candidate

on:
  workflow_dispatch:
    inputs:
      public_release:
        description: Publish a signed public release after external release prerequisites are configured.
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-candidate:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.15.0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Verify release provenance
        shell: pwsh
        run: |
          $channel = if ('${{ github.event_name }}' -eq 'push') { 'release' } else { 'candidate' }
          node scripts/verify-release.mjs --channel=$channel --json-out=target/release/build-info.json

      - name: Verify and build candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:e2e
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          pnpm --filter @prompt-hub/desktop exec tauri build

      - name: Record installer checksums
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle -Recurse -File |
            Get-FileHash -Algorithm SHA256 |
            Format-Table -AutoSize | Out-String |
            Tee-Object -FilePath target/release/bundle/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: prompt-hub-windows-${{ github.event_name == 'push' && 'release' || 'candidate' }}-${{ github.sha }}
          path: |
            target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

      - name: Block unsigned public release
        if: ${{ inputs.public_release == true }}
        shell: pwsh
        run: |
          throw "Public release is blocked: configure a user-controlled signing certificate, signing workflow, update service, and clean-profile acceptance evidence before enabling publication."
