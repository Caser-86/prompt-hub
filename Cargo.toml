[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/prompt-domain",
  "crates/prompt-ai",
  "crates/prompt-import",
  "crates/prompt-mcp",
  "crates/prompt-security",
  "crates/prompt-store",
]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
async-trait = "0.1.89"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
secrecy = "0.10.3"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["serde", "formatting", "parsing", "macros"] }
uuid = { version = "1.23.5", features = ["serde", "v7"] }
url = "2.5.8"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
tokio = { version = "1.52.3", features = ["sync", "macros", "rt"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
