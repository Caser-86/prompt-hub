[workspace]
members = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1.23.5", features = ["serde", "v7"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

